<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>UGC NET CBT Simulator</title>
    
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; 
            background-color: #f9fafb;
            touch-action: pan-x pan-y;
        }

        #root {
            width: 100%;
            height: 100%;
        }

        .app-wrapper {
            height: 100vh; /* Fallback for older browsers */
            height: 100dvh; /* Dynamic viewport height for modern mobile browsers */
            display: flex;
            flex-direction: column;
            width: 100%;
            overflow: hidden;
        }

        @media (max-width: 768px) {
            .mobile-hide { display: none !important; }
            .mobile-palette-container { 
                position: fixed; 
                bottom: 0; 
                left: 0; 
                right: 0; 
                top: auto; 
                height: 85vh; 
                border-radius: 20px 20px 0 0; 
                box-shadow: 0 -10px 25px rgba(0,0,0,0.3); 
                z-index: 50; 
                transform: translateY(100%); 
                transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
                display: flex;
                flex-direction: column;
            }
            .mobile-palette-container.open { transform: translateY(0); }
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #a8a8a8; }

        input[type="radio"] {
            width: 1.5rem;
            height: 1.5rem;
        }
        
        .no-select {
            -webkit-user-select: none;
            user-select: none;
        }

        .safe-area-pb {
            /* Ensures bottom padding for devices with home indicators (e.g. iPhone) */
            padding-bottom: max(1rem, env(safe-area-inset-bottom));
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const defaultQuestions = [
            {
                question: "Which level of teaching relies most heavily on the rote memorization of facts and information without necessarily requiring deep understanding?",
                options: ["Memory Level", "Understanding Level", "Reflective Level", "Pedagogical Level"],
                correctAnswer: "Memory Level"
            },
            {
                question: "In the context of adult learners (Andragogy), which of the following characteristics is most distinct from pedagogy (teaching children)?",
                options: ["Learners rely completely on the instructor for direction.", "Learning is highly subject-centered rather than problem-centered.", "Internal motivation is a stronger driver than external rewards.", "Learners have little to no lived experience to draw upon."],
                correctAnswer: "Internal motivation is a stronger driver than external rewards."
            },
            {
                question: "A teacher is conducting a quiz during the course of instruction to monitor student progress and provide immediate feedback. Which type of evaluation is this?",
                options: ["Summative Evaluation", "Formative Evaluation", "Diagnostic Evaluation", "Placement Evaluation"],
                correctAnswer: "Formative Evaluation"
            },
            {
                question: "Which of the following teaching methods is considered primarily 'Learner-Centered'?",
                options: ["Lecture Method", "Team Teaching", "Heuristic Method", "Demonstration Method"],
                correctAnswer: "Heuristic Method"
            },
            {
                question: "Under the Choice Based Credit System (CBCS) in Indian higher education, which type of course is considered mandatory and foundational for all students in a specific discipline?",
                options: ["Elective Course", "Core Course", "Ability Enhancement Course", "Skill Enhancement Course"],
                correctAnswer: "Core Course"
            }
        ];

        function App() {
            const [questions, setQuestions] = React.useState([]);
            const [currentQIndex, setCurrentQIndex] = React.useState(0);
            const [showMobilePalette, setShowMobilePalette] = React.useState(false);
            const [timeLeft, setTimeLeft] = React.useState(3600); // 60 minutes
            const [examStarted, setExamStarted] = React.useState(false);
            const [examSubmitted, setExamSubmitted] = React.useState(false);
            const [score, setScore] = React.useState(0);
            const [answers, setAnswers] = React.useState({});
            const [qStatus, setQStatus] = React.useState([]);

            React.useEffect(() => {
                fetch('ugc_net_full_mock.json')
                    .then(res => res.ok ? res.json() : Promise.reject('Fallback'))
                    .then(data => {
                        const loadedQuestions = data.answeredQuestions ? data.answeredQuestions : (data.questions || data);
                        const cleanQuestions = loadedQuestions.map(q => {
                            if (q.options) return q;
                            return {
                                question: q.question,
                                correctAnswer: q.correctAnswer,
                                options: [q.correctAnswer, "Option B", "Option C", "Option D"].sort(() => Math.random() - 0.5)
                            }
                        });
                        
                        setQuestions(cleanQuestions);
                        setQStatus(new Array(cleanQuestions.length).fill('not_visited'));
                    })
                    .catch(err => {
                        console.warn("Could not load external JSON, using default questions.");
                        setQuestions(defaultQuestions);
                        setQStatus(new Array(defaultQuestions.length).fill('not_visited'));
                    });
                    
                setTimeout(() => {
                    if (window.lucide) window.lucide.createIcons();
                }, 100);
            }, []);

            React.useEffect(() => {
                let timer;
                if (examStarted && !examSubmitted && timeLeft > 0) {
                    timer = setInterval(() => {
                        setTimeLeft(prev => prev - 1);
                    }, 1000);
                } else if (timeLeft === 0 && examStarted && !examSubmitted) {
                    submitExam();
                }
                return () => clearInterval(timer);
            }, [examStarted, examSubmitted, timeLeft]);

            React.useEffect(() => {
                if (window.lucide) window.lucide.createIcons();
            });

            const formatTime = (seconds) => {
                const h = Math.floor(seconds / 3600);
                const m = Math.floor((seconds % 3600) / 60);
                const s = seconds % 60;
                return `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
            };

            const getStatusColor = (status) => {
                switch(status) {
                    case 'answered': return 'bg-green-600 text-white border-green-700';
                    case 'not_answered': return 'bg-red-500 text-white border-red-600';
                    case 'marked': return 'bg-purple-600 text-white border-purple-700';
                    case 'answered_marked': return 'bg-purple-600 text-white border-purple-700 relative overflow-hidden';
                    default: return 'bg-gray-200 text-gray-700 border-gray-300';
                }
            };

            const getStatusCounts = () => {
                const counts = { answered: 0, not_answered: 0, marked: 0, answered_marked: 0, not_visited: 0 };
                qStatus.forEach(s => {
                    if (counts[s] !== undefined) counts[s]++;
                });
                return counts;
            };

            const handleStart = () => {
                if (questions.length === 0) return;
                setExamStarted(true);
                updateStatus(0, 'not_answered'); 
            };

            const updateStatus = (index, newStatus) => {
                setQStatus(prev => {
                    const newArr = [...prev];
                    if ((newArr[index] === 'answered' || newArr[index] === 'answered_marked') && newStatus === 'not_answered') {
                        return newArr; 
                    }
                    newArr[index] = newStatus;
                    return newArr;
                });
            };

            const handleOptionSelect = (option) => {
                setAnswers(prev => ({ ...prev, [currentQIndex]: option }));
            };

            const handleSaveAndNext = () => {
                if (answers[currentQIndex]) {
                    updateStatus(currentQIndex, 'answered');
                } else {
                    updateStatus(currentQIndex, 'not_answered');
                }
                goToNextQuestion();
            };

            const handleMarkForReview = () => {
                if (answers[currentQIndex]) {
                    updateStatus(currentQIndex, 'answered_marked');
                } else {
                    updateStatus(currentQIndex, 'marked');
                }
                goToNextQuestion();
            };

            const handleClearResponse = () => {
                const newAnswers = { ...answers };
                delete newAnswers[currentQIndex];
                setAnswers(newAnswers);
                updateStatus(currentQIndex, 'not_answered'); 
            };

            const goToNextQuestion = () => {
                if (currentQIndex < questions.length - 1) {
                    const nextIndex = currentQIndex + 1;
                    setCurrentQIndex(nextIndex);
                    if (qStatus[nextIndex] === 'not_visited') {
                        updateStatus(nextIndex, 'not_answered');
                    }
                }
            };

            const goToQuestion = (index) => {
                setCurrentQIndex(index);
                setShowMobilePalette(false); 
                if (qStatus[index] === 'not_visited') {
                    updateStatus(index, 'not_answered');
                }
            };

            const submitExam = () => {
                let calculatedScore = 0;
                questions.forEach((q, idx) => {
                    if (answers[idx] === q.correctAnswer) {
                        calculatedScore += 2;
                    }
                });
                setScore(calculatedScore);
                setExamSubmitted(true);
            };

            if (!examStarted) {
                return (
                    <div className="flex items-center justify-center h-full w-full bg-gray-100 p-4 font-sans overflow-y-auto">
                        <div className="bg-white p-6 md:p-10 rounded-xl shadow-xl max-w-lg w-full text-center border-t-4 border-blue-600 m-auto">
                            <img src="https://upload.wikimedia.org/wikipedia/en/thumb/8/87/National_Testing_Agency_logo.svg/300px-National_Testing_Agency_logo.svg.png" 
                                 alt="NTA Logo" className="h-16 mx-auto mb-6 object-contain" 
                                 onError={(e) => { e.target.style.display = 'none'; }} />
                            <h1 className="text-2xl md:text-3xl font-bold text-gray-800 mb-2">UGC NET Paper 1</h1>
                            <p className="text-gray-500 mb-8 font-medium">Computer Based Test (CBT) Simulator</p>
                            
                            <div className="text-left bg-blue-50 p-4 rounded-lg mb-8 border border-blue-100">
                                <h3 className="font-bold text-blue-800 mb-2 border-b border-blue-200 pb-1">Instructions:</h3>
                                <ul className="list-disc pl-5 text-sm text-blue-900 space-y-1">
                                    <li>Total Questions: {questions.length > 0 ? questions.length : 'Loading...'}</li>
                                    <li>Total Time: 60 Minutes</li>
                                    <li>Each question carries 2 marks.</li>
                                    <li>No negative marking.</li>
                                </ul>
                            </div>
                            
                            <button onClick={handleStart} disabled={questions.length === 0} className="w-full bg-blue-600 hover:bg-blue-700 disabled:bg-gray-400 text-white font-bold py-3 px-6 rounded-lg transition-colors shadow-md text-lg active:scale-[0.98]">
                                {questions.length > 0 ? 'I am ready to begin' : 'Loading questions...'}
                            </button>
                        </div>
                    </div>
                );
            }

            if (examSubmitted) {
                return (
                    <div className="flex items-center justify-center h-full w-full bg-gray-100 p-4 font-sans overflow-y-auto">
                        <div className="bg-white p-6 md:p-10 rounded-xl shadow-xl max-w-2xl w-full m-auto">
                            <div className="text-center mb-8">
                                <i data-lucide="check-circle" className="w-16 h-16 text-green-500 mx-auto mb-4"></i>
                                <h1 className="text-3xl font-bold text-gray-800">Test Submitted Successfully</h1>
                                <p className="text-gray-600 mt-2">Here is your performance summary</p>
                            </div>
                            
                            <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
                                <div className="bg-blue-50 p-4 rounded-lg text-center border border-blue-100">
                                    <div className="text-sm text-blue-600 font-bold uppercase">Total Score</div>
                                    <div className="text-2xl font-black text-blue-800">{score} <span className="text-lg font-medium text-blue-600">/ {questions.length * 2}</span></div>
                                </div>
                                <div className="bg-green-50 p-4 rounded-lg text-center border border-green-100">
                                    <div className="text-sm text-green-600 font-bold uppercase">Correct</div>
                                    <div className="text-2xl font-black text-green-800">{score / 2}</div>
                                </div>
                                <div className="bg-red-50 p-4 rounded-lg text-center border border-red-100">
                                    <div className="text-sm text-red-600 font-bold uppercase">Incorrect</div>
                                    <div className="text-2xl font-black text-red-800">{Object.keys(answers).length - (score / 2)}</div>
                                </div>
                                <div className="bg-gray-50 p-4 rounded-lg text-center border border-gray-200">
                                    <div className="text-sm text-gray-600 font-bold uppercase">Unattempted</div>
                                    <div className="text-2xl font-black text-gray-800">{questions.length - Object.keys(answers).length}</div>
                                </div>
                            </div>

                            <button onClick={() => window.location.reload()} className="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-6 rounded-lg transition-colors shadow-md active:scale-[0.98]">
                                Restart Simulator
                            </button>
                        </div>
                    </div>
                );
            }

            const currentQ = questions[currentQIndex];
            const counts = getStatusCounts();

            return (
                <div className="app-wrapper bg-gray-50 font-sans text-sm md:text-base no-select">
                    
                    {/* Header */}
                    <header className="bg-[#1f4e79] text-white py-2 px-4 flex justify-between items-center shadow-md shrink-0 z-20">
                        <div className="flex items-center">
                            <span className="font-bold text-lg hidden md:block tracking-wide">National Testing Agency (UGC NET)</span>
                            <span className="font-bold text-lg md:hidden tracking-wide">UGC NET Simulator</span>
                        </div>
                        <div className="flex items-center gap-4">
                            <div className="bg-white/10 px-3 py-1 rounded text-sm font-mono flex items-center border border-white/20">
                                <i data-lucide="clock" className="w-4 h-4 mr-2"></i>
                                Time Left: <span className={`ml-2 font-bold ${timeLeft < 300 ? 'text-red-400' : 'text-white'}`}>{formatTime(timeLeft)}</span>
                            </div>
                        </div>
                    </header>

                    {/* Main content wrapper */}
                    <div className="flex-1 flex flex-col md:flex-row overflow-hidden relative">
                        
                        {/* Left Side: Question Area */}
                        <div className="flex-1 flex flex-col bg-white overflow-hidden relative z-0">
                            
                            {/* Question Header */}
                            <div className="bg-gray-100 p-2 md:p-3 border-b border-gray-300 flex justify-between items-center shrink-0 shadow-sm">
                                <div className="font-bold text-[#1f4e79] flex items-center">
                                    <span className="bg-[#1f4e79] text-white px-2 py-0.5 rounded text-xs mr-2">Paper 1</span>
                                    Teaching & Research Aptitude
                                </div>
                                <button onClick={() => setShowMobilePalette(true)} className="md:hidden flex items-center text-blue-700 bg-blue-100 px-3 py-1.5 rounded-md font-semibold text-sm border border-blue-200 shadow-sm active:bg-blue-300 transition-colors">
                                    <i data-lucide="layout-grid" className="w-4 h-4 mr-1"></i> Questions
                                </button>
                            </div>
                            
                            {/* Scrollable Question Content */}
                            <div className="flex-1 overflow-y-auto p-4 md:p-6 pb-12">
                                <div className="flex mb-5 md:mb-6 text-gray-800">
                                    <span className="font-bold mr-3 text-base md:text-lg shrink-0 mt-0.5">{currentQIndex + 1}.</span>
                                    <div className="text-base md:text-lg font-medium whitespace-pre-wrap leading-relaxed">{currentQ.question}</div>
                                </div>

                                <div className="space-y-4 pl-2 md:pl-7 pb-8"> 
                                    {currentQ.options.map((option, index) => (
                                        <label key={index} className={`flex items-start p-3 md:p-4 rounded-lg border-2 cursor-pointer transition-colors ${answers[currentQIndex] === option ? 'border-blue-500 bg-blue-50 shadow-sm' : 'border-gray-200 hover:bg-gray-50'}`}>
                                            <input 
                                                type="radio" 
                                                name={`question-${currentQIndex}`}
                                                value={option}
                                                checked={answers[currentQIndex] === option}
                                                onChange={() => handleOptionSelect(option)}
                                                className="mt-0.5 mr-4 shrink-0 text-blue-600 focus:ring-blue-500 cursor-pointer"
                                            />
                                            <span className="text-gray-700 leading-snug cursor-pointer block w-full">{option}</span>
                                        </label>
                                    ))}
                                </div>
                            </div>

                            {/* Footer Buttons (Locked at bottom via shrink-0 in a flex-col layout) */}
                            <div className="bg-gray-100 border-t border-gray-300 p-3 sm:p-4 flex justify-between items-center shrink-0 w-full z-10 shadow-[0_-10px_15px_-3px_rgba(0,0,0,0.05)] safe-area-pb">
                                <div className="flex gap-2">
                                    <button onClick={handleMarkForReview} className="px-3 py-3 sm:px-5 sm:py-2.5 border border-gray-400 bg-white hover:bg-gray-50 text-gray-700 font-semibold rounded shadow-sm text-xs sm:text-sm transition flex items-center justify-center min-w-[85px] active:bg-gray-200">
                                        <span className="sm:hidden"><i data-lucide="bookmark" className="w-4 h-4 mr-1"></i></span>
                                        <span className="hidden sm:inline">Mark & Next</span>
                                        <span className="sm:hidden">Mark</span>
                                    </button>
                                    <button onClick={handleClearResponse} className="px-3 py-3 sm:px-5 sm:py-2.5 border border-gray-400 bg-white hover:bg-gray-50 text-gray-700 font-semibold rounded shadow-sm text-xs sm:text-sm transition flex items-center justify-center min-w-[85px] active:bg-gray-200">
                                        <span className="sm:hidden"><i data-lucide="eraser" className="w-4 h-4 mr-1"></i></span>
                                        <span className="hidden sm:inline">Clear</span>
                                        <span className="sm:hidden">Clear</span>
                                    </button>
                                </div>
                                <button onClick={handleSaveAndNext} className="px-6 py-3 sm:px-8 sm:py-2.5 bg-[#28a745] hover:bg-[#218838] text-white font-bold rounded shadow-md text-sm sm:text-base transition flex items-center justify-center active:bg-[#1e7e34]">
                                    Save & Next
                                </button>
                            </div>
                        </div>

                        {/* Mobile Overlay Backdrop */}
                        {showMobilePalette && (
                            <div className="fixed inset-0 bg-black/60 z-40 md:hidden transition-opacity" onClick={() => setShowMobilePalette(false)}></div>
                        )}

                        {/* Right Side: Question Palette */}
                        <div className={`mobile-palette-container md:relative md:w-[300px] shrink-0 bg-[#eef3f8] border-l border-gray-300 flex flex-col ${showMobilePalette ? 'open' : 'mobile-hide md:flex'}`}>
                            
                            <div className="p-3 bg-[#1f4e79] text-white font-bold flex justify-between items-center md:hidden rounded-t-[20px] shrink-0">
                                <span>Question Palette</span>
                                <button onClick={() => setShowMobilePalette(false)} className="p-1.5 hover:bg-white/20 rounded active:bg-white/30 transition-colors"><i data-lucide="x" className="w-5 h-5"></i></button>
                            </div>

                            <div className="p-3 bg-white border-b border-gray-300 items-center gap-3 shrink-0 hidden md:flex">
                                <div className="w-12 h-12 bg-gray-200 rounded overflow-hidden flex items-center justify-center shrink-0 border border-gray-300">
                                    <i data-lucide="user" className="w-8 h-8 text-gray-500"></i>
                                </div>
                                <div>
                                    <div className="font-bold text-gray-800 text-sm">John Doe</div>
                                    <div className="text-xs text-gray-500">Roll: 1234567890</div>
                                </div>
                            </div>

                            {/* Legend */}
                            <div className="p-3 grid grid-cols-2 gap-2 text-xs border-b border-gray-300 shrink-0 bg-white">
                                <div className="flex items-center gap-2"><span className="w-6 h-6 rounded flex items-center justify-center text-white bg-green-600 font-bold">{counts.answered}</span> <span className="leading-tight text-gray-700">Answered</span></div>
                                <div className="flex items-center gap-2"><span className="w-6 h-6 rounded flex items-center justify-center text-white bg-red-500 font-bold">{counts.not_answered}</span> <span className="leading-tight text-gray-700">Not Answered</span></div>
                                <div className="flex items-center gap-2"><span className="w-6 h-6 rounded flex items-center justify-center text-gray-700 bg-gray-200 font-bold border border-gray-300">{counts.not_visited}</span> <span className="leading-tight text-gray-700">Not Visited</span></div>
                                <div className="flex items-center gap-2"><span className="w-6 h-6 rounded flex items-center justify-center text-white bg-purple-600 font-bold">{counts.marked}</span> <span className="leading-tight text-gray-700">Marked</span></div>
                                <div className="flex items-center gap-2 col-span-2 mt-1">
                                    <span className="w-6 h-6 rounded flex items-center justify-center text-white bg-purple-600 font-bold relative overflow-hidden">
                                        {counts.answered_marked}
                                        <div className="absolute bottom-0 right-0 w-2 h-2 bg-green-400 rounded-tl-full"></div>
                                    </span> 
                                    <span className="leading-tight text-gray-700">Answered & Marked for Review</span>
                                </div>
                            </div>

                            {/* Palette Buttons Grid */}
                            <div className="flex-1 overflow-y-auto p-3 bg-[#eef3f8]">
                                <div className="font-bold text-[#1f4e79] mb-3 pb-1 border-b border-gray-300 text-sm">Teaching & Research Aptitude</div>
                                <div className="grid grid-cols-5 gap-2 pb-6">
                                    {questions.map((_, idx) => {
                                        const status = qStatus[idx];
                                        const isCurrent = idx === currentQIndex;
                                        const colorClass = getStatusColor(status);
                                        
                                        return (
                                            <button 
                                                key={idx}
                                                onClick={() => goToQuestion(idx)}
                                                className={`
                                                    w-full aspect-square rounded flex items-center justify-center text-sm font-bold border shadow-sm transition-transform active:scale-90
                                                    ${colorClass}
                                                    ${isCurrent ? 'ring-2 ring-blue-600 ring-offset-2' : ''}
                                                `}
                                            >
                                                {idx + 1}
                                                {status === 'answered_marked' && (
                                                    <div className="absolute bottom-0 right-0 w-2.5 h-2.5 bg-green-400 rounded-tl-full"></div>
                                                )}
                                            </button>
                                        );
                                    })}
                                </div>
                            </div>

                            {/* Final Submit Button */}
                            <div className="p-3 bg-white border-t border-gray-300 shrink-0 safe-area-pb">
                                <button onClick={() => {
                                    if(window.confirm('Are you sure you want to submit the exam? You cannot change answers after submission.')) {
                                        submitExam();
                                    }
                                }} className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded shadow transition text-sm active:scale-[0.98]">
                                    Submit Final Exam
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
